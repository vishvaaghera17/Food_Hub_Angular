<div class="admin-wrapper">
    <!-- Admin Sidebar -->
    <aside class="admin-sidebar">
      <div class="sidebar-logo">
        <span>🍔</span>
        <span>FoodHub Admin</span>
      </div>
      <nav class="sidebar-nav">
        <a routerLink="/admin/dashboard" routerLinkActive="active">
          <span>📊</span> Dashboard
        </a>
        <a routerLink="/admin/restaurants" routerLinkActive="active">
          <span>🏪</span> Restaurants
        </a>
        <a routerLink="/admin/foods" routerLinkActive="active">
          <span>🍱</span> Food Items
        </a>
        <a routerLink="/admin/orders" routerLinkActive="active">
          <span>📦</span> Orders
        </a>
        <a routerLink="/admin/users" routerLinkActive="active">
          <span>👥</span> Users
        </a>
      </nav>
      <div class="sidebar-footer">
        <a routerLink="/home" class="back-link">← Back to Site</a>
        <button (click)="logout()" class="btn-logout">Logout</button>
      </div>
    </aside>
  
    <!-- Admin Content -->
    <div class="admin-content">
      <header class="admin-header">
        <h2>Admin Panel</h2>
        <div class="admin-user">
          <span>👤 {{authService.getCurrentUser()?.name}}</span>
          <span class="admin-badge">Admin</span>
        </div>
      </header>
      <main class="admin-main">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
