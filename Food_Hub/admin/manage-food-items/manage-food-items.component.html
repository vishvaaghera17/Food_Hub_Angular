<div class="admin-page">
    <div class="page-top">
      <h2>🍱 Manage Food Items</h2>
      <button class="btn-add" (click)="openForm()">+ Add Food Item</button>
    </div>
  
    <div class="modal-overlay" *ngIf="showForm" (click)="closeForm()">
      <div class="modal" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h3>{{editMode ? 'Edit' : 'Add'}} Food Item</h3>
          <button (click)="closeForm()">✕</button>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Food Name *</label>
            <input [(ngModel)]="form.name" placeholder="Food Name">
          </div>
          <div class="form-group">
            <label>Price (₹) *</label>
            <input type="number" [(ngModel)]="form.price">
          </div>
          <div class="form-group">
            <label>Category *</label>
            <select [(ngModel)]="form.category">
              <option value="">Select Category</option>
              <option *ngFor="let cat of categories" [value]="cat">{{cat}}</option>
            </select>
          </div>
          <div class="form-group">
            <label>Restaurant *</label>
            <select [(ngModel)]="form.restaurant">
              <option value="">Select Restaurant</option>
              <option *ngFor="let r of restaurants" [value]="r._id">{{r.name}}</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Description</label>
            <input [(ngModel)]="form.description" placeholder="Describe the food">
          </div>
          <div class="form-group">
            <label>Preparation Time</label>
            <input [(ngModel)]="form.preparationTime" placeholder="15-20 min">
          </div>
          <div class="form-group">
            <label>Type</label>
            <select [(ngModel)]="form.isVeg">
              <option [ngValue]="true">Vegetarian</option>
              <option [ngValue]="false">Non-Vegetarian</option>
            </select>
          </div>
          <div class="form-group">
            <label>Availability</label>
            <select [(ngModel)]="form.isAvailable">
              <option [ngValue]="true">Available</option>
              <option [ngValue]="false">Not Available</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Food Image</label>
            <input type="file" (change)="onFileChange($event)" accept="image/*">
          </div>
        </div>
        <button class="btn-submit" (click)="submit()">{{editMode ? 'Update' : 'Add'}} Food Item</button>
      </div>
    </div>
  
    <div class="table-container">
      <table>
        <thead>
          <tr><th>Image</th><th>Name</th><th>Category</th><th>Restaurant</th><th>Price</th><th>Type</th><th>Available</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let f of foods">
            <td><img [src]="getImageUrl(f.image)" class="table-img"></td>
            <td><strong>{{f.name}}</strong></td>
            <td>{{f.category}}</td>
            <td>{{f.restaurant?.name}}</td>
            <td>₹{{f.price}}</td>
            <td><span class="veg-badge" [class.nonveg]="!f.isVeg">{{f.isVeg ? '🟢 Veg' : '🔴 Non-Veg'}}</span></td>
            <td><span class="badge" [class.active]="f.isAvailable">{{f.isAvailable ? 'Yes' : 'No'}}</span></td>
            <td>
              <button class="btn-edit" (click)="openForm(f)">✏️ Edit</button>
              <button class="btn-delete" (click)="delete(f._id)">🗑️ Delete</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
