<nav class="navbar">
    <div class="nav-container">
      <a routerLink="/home" class="nav-logo">
        🍔 <span>FoodHub</span>
      </a>
  
      <button class="hamburger" (click)="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
  
      <ul class="nav-menu" [class.active]="isMenuOpen">
        <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a></li>
        <li><a routerLink="/restaurants" routerLinkActive="active">Restaurants</a></li>
        <li><a routerLink="/foods" routerLinkActive="active">Food Items</a></li>
  
        <ng-container *ngIf="!user">
          <li><a routerLink="/login" routerLinkActive="active" class="btn-outline">Login</a></li>
          <li><a routerLink="/register" routerLinkActive="active" class="btn-primary">Register</a></li>
        </ng-container>
  
        <ng-container *ngIf="user">
          <li>
            <a routerLink="/cart" routerLinkActive="active" class="cart-link">
              🛒 Cart <span class="badge" *ngIf="cartCount > 0">{{cartCount}}</span>
            </a>
          </li>
          <li><a routerLink="/orders" routerLinkActive="active">My Orders</a></li>
          <li *ngIf="user.role === 'admin'">
            <a routerLink="/admin" class="btn-admin">Admin Panel</a>
          </li>
          <li class="user-menu">
            <span class="user-name">👤 {{user.name}}</span>
            <button (click)="logout()" class="btn-logout">Logout</button>
          </li>
        </ng-container>
      </ul>
    </div>
  </nav>
