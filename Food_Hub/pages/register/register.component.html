<div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🍔</div>
        <h2>Create Account</h2>
        <p>Join FoodHub and order your favourite food</p>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" [(ngModel)]="form.name" name="name" required placeholder="Your Name">
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" [(ngModel)]="form.phone" name="phone" placeholder="+91 XXXXX XXXXX">
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="form.email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Delivery Address</label>
          <input type="text" [(ngModel)]="form.address" name="address" placeholder="Your delivery address">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Password</label>
            <input type="password" [(ngModel)]="form.password" name="password" required placeholder="••••••••">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" [(ngModel)]="form.confirmPassword" name="confirmPassword" required placeholder="••••••••">
          </div>
        </div>
        <div class="error-msg" *ngIf="error">⚠️ {{error}}</div>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{loading ? 'Creating Account...' : 'Create Account'}}
        </button>
      </form>
      <p class="auth-link">Already have an account? <a routerLink="/login">Login here</a></p>
    </div>
  </div>
