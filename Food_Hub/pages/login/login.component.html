<div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">🍔</div>
        <h2>Welcome Back!</h2>
        <p>Login to your FoodHub account</p>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="form.email" name="email" required placeholder="you@email.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="form.password" name="password" required placeholder="••••••••">
        </div>
        <div class="error-msg" *ngIf="error">⚠️ {{error}}</div>
        <button type="submit" class="btn-submit" [disabled]="loading">
          {{loading ? 'Logging in...' : 'Login'}}
        </button>
      </form>
      <p class="auth-link">Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
  </div>
